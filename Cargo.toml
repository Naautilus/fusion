[package]
name = "fusion"
version = "0.1.0"
edition = "2024"

[dependencies]

# nalgebra
nalgebra = "*"

# wgpu
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "30.0"
pollster = "0.3"
bytemuck = { version = "1.24", features = [ "derive" ] }
cgmath = "0.18" # will replace with nalgebra later

[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]